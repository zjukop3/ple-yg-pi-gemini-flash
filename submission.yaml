name: yg-pi-gemini-flash
model_api: google-cloud/gemini-3.8-flash
install: >-
  npm ci --prefix {src} --no-fund --no-audit --offline --cache {src}/.npm-cache
  && uv venv --python {src}/.python/bin/python3 /opt/harness/venv
  && uv pip install --offline --find-links {src}/.wheels --python /opt/harness/venv/bin/python -r {src}/requirements.txt
serve: /opt/harness/venv/bin/python {src}/serve.py
